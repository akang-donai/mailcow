# deploy/nginx-mcp.conf
#
# This file has TWO install points -- read both before running `nginx -t`.
#
# 1) The `limit_req_zone` block below is only valid in nginx's `http {}`
#    context. Paste it into the main nginx config's http block (aaPanel:
#    Nginx plugin -> "Config Modification" / main config, i.e. the http{}
#    section of /www/server/nginx/conf/nginx.conf), NOT into the per-site
#    file from part 2. If it ends up in that per-site file, `nginx -t` will
#    fail with '"limit_req_zone" directive is not allowed here', because
#    that file is included *inside* this site's server{} block, and
#    limit_req_zone cannot live there -- only the `limit_req` directive
#    that references a zone by name can.
#
#       ---- paste into http{} once, globally ----
#       limit_req_zone $binary_remote_addr zone=mcp_authorize:10m rate=10r/s;
#       limit_req_zone $binary_remote_addr zone=mcp_token:10m     rate=20r/s;
#       limit_req_zone $binary_remote_addr zone=mcp_register:10m  rate=1r/s;
#       # /consent is a human typing a mailbox app password, not an API
#       # client -- sized far below the zones above. Without this, anyone
#       # holding a pending-authorization handle (10 min TTL) could throw
#       # unlimited password guesses at it for the handle's whole lifetime.
#       limit_req_zone $binary_remote_addr zone=mcp_consent:10m   rate=5r/m;
#       ---- end http{} paste ----
#
# 2) Everything from here down is the per-site override. Install it to:
#      /www/server/panel/vhost/nginx/extension/mailcp.mizutech.id/mcp.conf
#    That path specifically -- aaPanel rewrites the main vhost file whenever
#    the site is edited in its UI, but the extension/ include survives.
#
# After both parts are in place: nginx -t && nginx -s reload

# Every proxied location below sets X-Real-IP / X-Forwarded-For /
# X-Forwarded-Proto. The application calls `app.set('trust proxy', 1)`
# specifically so the SDK's built-in rate limiters on /register, /authorize
# and /token key on the real client address instead of collapsing every
# tenant into one bucket -- but `trust proxy` only takes effect if something
# upstream actually sets these headers, which is what this section is for.
#
# $proxy_add_x_forwarded_for (not $remote_addr) is used for X-Forwarded-For
# so an existing chain is appended to rather than replaced, and `1` means
# the app reads the RIGHTMOST entry -- the address nginx itself observed.
# A client that sends its own X-Forwarded-For therefore only prepends to a
# list whose last element nginx still writes, and cannot move its own
# rate-limit bucket.
#
# What is NOT true, and was previously claimed here: that a direct client
# "still could not spoof these". Express cannot tell nginx apart from any
# other process reaching 127.0.0.1:8787 -- it sees a TCP connection, not an
# identity. Remote clients cannot reach 8787 at all, because the container
# publishes it on the host's loopback only. A local process on merbabu can,
# and can set these headers to anything. That is not a new exposure: a
# compromise of this shared host already reads the AES key and the whole
# credential database off disk (see deploy/README.md, "What this deployment
# does NOT protect against").

# ^~ beats the vhost's regex `location ~ \.well-known { allow all; }`, which
# outranks a prefix location and would otherwise serve these two discovery
# documents from the empty document root and 404 -- OAuth discovery would
# fail before it started.
location ^~ /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /mcp {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;         # required for streamed responses
    proxy_read_timeout 3600s;
}

location ^~ /authorize {
    limit_req zone=mcp_authorize burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /token {
    limit_req zone=mcp_token burst=40 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /register {
    limit_req zone=mcp_register burst=5 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /revoke {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /consent {
    # See the mcp_consent zone comment above: this is the credential-
    # submission endpoint, so it gets the tightest limit of the group.
    limit_req zone=mcp_consent burst=5 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Tighten TLS for this vhost only (the panel default allows TLS1.1 + 3DES).
# CAUTION: nginx is last-one-wins within a context. If aaPanel's own
# vhost-managed SSL block emits its own `ssl_protocols`/`ssl_ciphers` AFTER
# the point where it includes this extension/ directory, these two lines
# are silently shadowed -- `nginx -t` will not warn you. Verify this
# actually took effect using deploy/README.md section 4's `nginx -T` and
# `openssl s_client -tls1_1` checks after every reload, not just the first.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
